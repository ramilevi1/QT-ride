<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offer a Ride</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='css/main_search_offer.css')}}">
</head>
<body>
    <div class="container">
        <h1>Offer a Ride</h1>
        <form id="offer-ride-form" action="/offer_ride" method="POST">
            <label for="origin">Origin</label>
            <input type="text" id="origin" name="origin" placeholder="Enter origin" required>

            <label for="destination">Destination</label>
            <input type="text" id="destination" name="destination" placeholder="Enter destination" required>

            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>

            <label for="time">Time</label>
            <input type="time" id="time" name="time" required>

            <label for="seats_available">Seats Available</label>
            <input type="number" id="seats_available" name="seats_available" placeholder="Enter number of seats available" min="1" required>

            <label for="price">Price (Optional)</label>
            <input type="number" id="price" name="price" placeholder="Enter price in MXN" step="10">


            <button type="submit">Offer Ride</button>

            <button type="reset">Reset</button>

            <h2 id="response-message"></h2>

        </form>

        <h2 id="response-message"></h2>
    </div>

    <div class="button-container">
        <a href="{{url_for('index')}}">Index</a>
        <a href="{{url_for('search_ride')}}">Search a Ride</a>
    </div>

    <script>
        document.getElementById('offer-ride-form').addEventListener('submit', async function (event) {
            event.preventDefault(); // Prevent default form submission

            const origin = document.getElementById('origin').value;
            const destination = document.getElementById('destination').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            const seats_available = document.getElementById('seats_available').value;
            const price = document.getElementById('price').value;

            // Send the form data as JSON to the server
            try {
                const response = await fetch('/offer_ride', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        origin,
                        destination,
                        date,
                        time,
                        seats_available,
                        price
                    }),
                });

            const responseMessage = document.getElementById('response-message');

            // Handle the response
            if (response.ok) {
                responseMessage.textContent = 'Ride offered successfully!';
                responseMessage.className = 'success'; // Style success messages
                document.getElementById('offer-ride-form').reset(); // Optionally reset the form
            } else {
                const result = await response.json();
                responseMessage.textContent = 'Failed to offer the ride: ' + (result.error || 'Unknown error');
                responseMessage.className = 'error'; // Style error messages
            }
        } catch (error) {
        console.error('Error:', error);
    }
    });

    </script>
</body>
</html>
